name: CI

# En ramas y PRs corre directamente. En main y pre NO corre por push: deploy.yml
# lo invoca como workflow reutilizable (job "verify"), así cada push a esas dos
# ramas tiene UNA sola ejecución de CI, ligada a su pipeline de deploy.
on:
  push:
    branches-ignore: [main, pre]
  pull_request:
  workflow_call:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, intl, json, gd
          coverage: none

      - name: Lint (php -l)
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find php/app php/public php/tools scripts -name '*.php' -print0)
          exit $fail

      - name: Build fixture database
        run: php php/tools/ci_fixture.php /tmp/ci-mdc.db

      - name: Start built-in server
        env:
          DB_PATH: /tmp/ci-mdc.db
        run: |
          php -S 127.0.0.1:8000 -t php/public php/public/index.php > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 20); do
            if curl -fs -o /dev/null http://127.0.0.1:8000/health; then
              echo "Servidor listo."
              exit 0
            fi
            sleep 0.5
          done
          echo "El servidor no respondió a tiempo."
          cat /tmp/server.log
          exit 1

      - name: Smoke tests (entorno PRO)
        run: php php/tools/ci_smoke.php http://127.0.0.1:8000 pro

      - name: Stop server (PRO)
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      # Segunda pasada como entorno local. Sin ella, las secciones que aún no se
      # publican fuera de local (App\Secciones: dedicatorias, estado del
      # catálogo, mapa y temporada) se quedarían sin ninguna prueba de
      # contenido: la pasada de arriba solo puede comprobar que dan 404. El
      # config.local.php es el mismo mecanismo que usa un portátil de
      # desarrollo, y está gitignored, así que se escribe aquí y muere con el
      # runner.
      - name: Configure local environment
        run: |
          cat > php/app/config.local.php <<'PHP'
          <?php
          return ['env' => 'local'];
          PHP

      - name: Start built-in server (entorno local)
        env:
          DB_PATH: /tmp/ci-mdc.db
        run: |
          php -S 127.0.0.1:8001 -t php/public php/public/index.php > /tmp/server-local.log 2>&1 &
          echo $! > /tmp/server-local.pid
          for i in $(seq 1 20); do
            if curl -fs -o /dev/null http://127.0.0.1:8001/health; then
              echo "Servidor listo."
              exit 0
            fi
            sleep 0.5
          done
          echo "El servidor no respondió a tiempo."
          cat /tmp/server-local.log
          exit 1

      - name: Smoke tests (entorno local)
        run: php php/tools/ci_smoke.php http://127.0.0.1:8001 local

      - name: Server logs (siempre, para depurar fallos)
        if: always()
        run: |
          cat /tmp/server.log || true
          cat /tmp/server-local.log || true

      - name: Stop servers
        if: always()
        run: |
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          kill "$(cat /tmp/server-local.pid)" 2>/dev/null || true
