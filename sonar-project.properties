# Configuración para SonarQube Cloud (ex SonarCloud) — OPCIONAL Y HOY INACTIVA.
#
# Este fichero no hace nada por sí solo: no existe ningún workflow que invoque
# el scanner. Está aquí para que activar Sonar sea cuestión de minutos si algún
# día se quiere el panel web y el histórico de métricas, sin tener que averiguar
# otra vez qué excluir. El gate real del repositorio es .github/workflows/
# quality.yml (PHPStan + jscpd + PHPMD) — ver docs/code-quality.md §3.
#
# Para activarlo:
#   1. sonarcloud.io → importar jgcoronado/marchasdecristo (gratis: el repo es
#      público). Elegir análisis "CI-based", no "Automatic Analysis", para que
#      respete estas exclusiones.
#   2. Guardar el token como secret SONAR_TOKEN en el repositorio.
#   3. Añadir el job del scanner (bloque listo para copiar en
#      docs/code-quality.md §7).

sonar.projectKey=jgcoronado_marchasdecristo
sonar.organization=jgcoronado
sonar.projectName=Marchas de Cristo

sonar.sources=php/app,php/public,php/tools,scripts,tools
sonar.sourceEncoding=UTF-8

# Datos generados (padrón de municipios del INE, 8.100 líneas), fuentes
# tipográficas y los HTML de trabajo de docs/: no son código que se revise.
sonar.exclusions=php/app/geo/municipios_es.php,php/app/fonts/**,docs/**,**/node_modules/**,.tools/**,build/**

# Las plantillas de php/app/templates reciben sus variables por extract() en
# View::capture(); las reglas de "variable no definida" dan falsos positivos ahí.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=php/app/templates/**/*.php

# El proyecto no tiene tests unitarios (la verificación es de integración:
# php/tools/ci_smoke.php contra un servidor real). Sin esto, el quality gate
# por defecto suspende por 0% de cobertura en algo que no la mide así.
sonar.coverage.exclusions=**/*
